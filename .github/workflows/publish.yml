name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publisher authentication

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. The Node version's
      # bundled npm is often older than that, so upgrade explicitly rather
      # than relying on whatever ships with the runner's Node install.
      - run: npm install -g npm@latest

      - run: npm ci --ignore-scripts

      - run: npm test

      # Beta tags (e.g. v0.3.0-beta.0) → publish immediately under the "beta" dist-tag.
      # Users still get 0.2.0 with `npm install nhsuk-prototype-kit-validation`;
      # testers opt in with `npm install nhsuk-prototype-kit-validation@beta`.
      - name: Publish pre-release (beta dist-tag)
        if: contains(github.ref_name, '-')
        run: npm publish --tag beta --provenance --access public

      # Full release tags (e.g. v0.3.0) → publish under the default "latest"
      # dist-tag via npm's Trusted Publisher (OIDC) flow — no NPM token
      # secret needed, provided the package is configured as a trusted
      # publisher for this repo/workflow on npmjs.com.
      - name: Publish full release
        if: "!contains(github.ref_name, '-')"
        run: npm publish --provenance --access public
